<style>
:root{
  --paper:#eceef0;
  --card:#ffffff;
  --ink:#15181b;
  --muted:#5a6269;
  --line:#cdd2d7;
  --accent:#b4232c;
  --accent-soft:rgba(180,35,44,.18);
  --ok:#1b7a45;
  --ok-bg:#e1f2e8;
  --warn:#8a5a00;
  --warn-bg:#fbefd0;
  --struck-bg:#f0f1f3;
  --zebra:#f6f7f8;
  --display:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111315;--card:#1a1d20;--ink:#eef0f2;--muted:#9ba3ab;--line:#32373c;
    --accent:#f0646c;--accent-soft:rgba(240,100,108,.26);
    --ok:#56c488;--ok-bg:#16301f;--warn:#e3ad3d;--warn-bg:#3a2d0e;--struck-bg:#23272b;--zebra:#1e2124;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.page{max-width:1180px;margin:0 auto;padding:0 0 24px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* Kopf */
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:46px;height:46px;flex:none;display:block;border:1px solid #15181b;background:#fff}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font:700 16px/1.1 var(--display);letter-spacing:.12em;white-space:nowrap}
.ttl span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.yearsel{flex:none;width:auto;min-width:92px;min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;font-size:16px}

/* Reiter */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px 0}
.tabs button{min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;font-size:15px;padding:4px 6px}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

main{padding:12px}
h1{margin:0;font:700 24px/1.15 var(--display)}
h2{margin:0;font:700 18px/1.2 var(--display)}
.head-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.msg{margin:0;font-size:14px;color:var(--muted)}
.msg b{color:var(--ink)}
.msg.warn{color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px;font-weight:600}
.msg.ok{color:var(--ok);background:var(--ok-bg);border-radius:10px;padding:8px 10px;font-weight:600}
.note{margin:8px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:grid;gap:12px}

/* Knöpfe, Felder */
.btn{display:inline-grid;place-items:center;min-height:48px;padding:6px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;text-decoration:none;text-align:center;line-height:1.15}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.small{min-height:40px;padding:4px 12px;font-size:14px}
.btn[disabled]{opacity:.4}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.head-row .btn-row .btn{flex:0 0 auto}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:500 17px/1.2 var(--body);background:var(--card);color:var(--ink)}
textarea{padding:10px 12px;min-height:96px;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.controls{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
@media (min-width:640px){ .controls{grid-template-columns:1fr 260px} }
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips button{min-width:48px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font:700 17px/1 var(--display)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Tabellen */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{padding:8px 8px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--ink);white-space:nowrap;background:var(--card)}
.tbl td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--card)}
.tbl tbody tr:nth-child(even) td{background:var(--zebra)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .l{text-align:left}
.tbl .pl{width:46px;min-width:46px;position:sticky;left:0;z-index:1;text-align:center;font-weight:700}
.tbl .nm{min-width:150px;position:sticky;left:46px;z-index:1;text-align:left;font-weight:600;box-shadow:1px 0 0 var(--line)}
.tbl .ve{text-align:left;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){ .tbl .ve{max-width:110px} .tbl .nm{min-width:128px} }
.tbl .drop{color:var(--muted)}
.tbl .sum{font-weight:700}
.tbl td.big{font-weight:700}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--struck-bg)}
.tbl tr.p1 td.pl{color:var(--accent);font-size:17px}
.tbl .sh{display:inline-block;min-width:1.5ch;margin-right:5px;text-align:center}
.tbl .sh.st{color:var(--muted);text-decoration:line-through}
.tbl .sh.ix{color:var(--accent);font-weight:700}
.tbl .muted{color:var(--muted)}
.empty{text-align:left;display:grid;gap:10px}
.empty ol{margin:0;padding-left:20px;display:grid;gap:4px}
.print-head{display:none}

/* Blatt/Dialog */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){ .sheet-bg{align-items:center} .sheet{border-radius:16px} }
.sheet-head{flex:none;display:flex;align-items:center;gap:8px;padding:10px 6px 8px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1}
.sheet-head .x{min-width:44px;min-height:44px;border:0;background:transparent;font-size:28px;line-height:1;color:var(--muted)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 16px;display:grid;gap:12px;align-content:start}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.lrow .nm2{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{grid-column:1;font-size:12.5px;color:var(--muted);min-width:0}
.lrow .rs{grid-column:2;grid-row:1 / span 2;text-align:right}
.lrow .rs b{font:700 22px/1 var(--display);display:block}
.lrow .rs span{font-size:12px;color:var(--muted)}
.lrow .acts{grid-column:1 / -1;display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);font-size:14px;cursor:pointer}
.opt input{margin-top:3px;width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--ink)}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.badge.new{background:var(--warn-bg);color:var(--warn)}
.badge.sent{background:var(--ok-bg);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100% - 24px);text-align:center}
footer{padding:8px 12px 0;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.5}
footer b{font-weight:600;letter-spacing:.03em}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:10pt}
  .bar,.tabs,.noprint,footer .noprint,.toast,.sheet-bg,.controls{display:none!important}
  main{padding:0}
  .print-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;margin-bottom:6px;padding-bottom:3px;font-size:11pt}
  .tscroll{overflow:visible;border:0}
  .tbl{font-size:9pt}
  .tbl th,.tbl td{padding:2px 5px;background:#fff!important;position:static!important;box-shadow:none!important}
  .tbl tbody tr:nth-child(even) td{background:#f2f2f2!important}
  .tbl .ve{max-width:none}
  h1,.head-row .msg{display:none}
  .head-row{margin:0}
}
</style>
</head>

<script>
/* IGOR-Kern: Wertung, Saison-Rangliste und Link-Codec. Wird in App und Tabelle eingebettet und in Node getestet. */
var IGORCORE=(function(){
'use strict';
var SHOTS=13, COUNT=10, BEST=6, MAXRECORDS=500;

/* ---------- Wertung eines Schützen: beste 10 von 13 ---------- */
function evaluate(shots,inners){
  var items=[];
  shots.forEach(function(v,i){
    if(v!==null && v!==undefined){ items.push({v:v,i:i,x:!!(inners && inners[i] && v===10)}); }
  });
  var n=items.length;
  var drop=Math.max(0,n-COUNT);
  // Streichen: niedrigste Ringzahl zuerst; bei gleicher Ringzahl faellt ein normaler Zehner vor einem Innenzehner, danach der spaetere Schuss
  var order=items.slice().sort(function(a,b){ return a.v-b.v || (a.x?1:0)-(b.x?1:0) || b.i-a.i; });
  var struck=new Set(order.slice(0,drop).map(function(s){ return s.i; }));
  var total=0,struckSum=0,counted=0,tens=0,inner=0,nines=0;
  items.forEach(function(s){
    total+=s.v;
    if(struck.has(s.i)){ struckSum+=s.v; }
    else {
      counted+=s.v;
      if(s.v===10){ tens++; if(s.x){ inner++; } } else if(s.v===9){ nines++; }
    }
  });
  return {n:n,drop:drop,total:total,struck:struck,struckSum:struckSum,counted:counted,tens:tens,inner:inner,nines:nines};
}

/* ---------- Texte ---------- */
function clean(s,max){
  var t=String(s==null?'':s);
  try{ t=t.normalize('NFC'); }catch(e){}
  return t.replace(/[\u0000-\u001f\u007f<>]/g,' ').replace(/\s+/g,' ').trim().slice(0,max||80);
}
function nkey(s){ return clean(s,80).toLocaleLowerCase('de-DE'); }
function pid(name,club){ return nkey(name)+'|'+nkey(club); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function fmt2(x){ return x.toFixed(2).replace('.',','); }

/* ---------- Schussfolge als Text: 0-9, A = Zehner, X = Innenzehner, - = leer ---------- */
function shotsToStr(shots,inners){
  return shots.map(function(v,i){
    if(v===null || v===undefined){ return '-'; }
    if(v===10){ return (inners && inners[i]) ? 'X' : 'A'; }
    return String(v);
  }).join('');
}
function strToShots(str){
  if(typeof str!=='string' || str.length!==SHOTS){ return null; }
  var shots=[], inner=[];
  for(var i=0;i<SHOTS;i++){
    var ch=str.charAt(i);
    if(ch==='-'){ shots.push(null); inner.push(false); }
    else if(ch==='A'){ shots.push(10); inner.push(false); }
    else if(ch==='X'){ shots.push(10); inner.push(true); }
    else if(ch>='0' && ch<='9'){ shots.push(ch.charCodeAt(0)-48); inner.push(false); }
    else { return null; }
  }
  return {shots:shots,inner:inner};
}

/* ---------- Ergebnis-Datensatz ----------
   {y:Saison, r:Wettkampf-Nr, n:Name, c:Verein, m:'100'|'50', s:Schussfolge | g,z,i:manuell, t:Zeit (s), o:'a'|'m'} */
function isInt(x){ return typeof x==='number' && isFinite(x) && Math.floor(x)===x; }
function sanitizeRecord(r){
  if(!r || typeof r!=='object'){ return null; }
  var y=Number(r.y), rd=Number(r.r);
  if(!isInt(y) || y<2000 || y>2100){ return null; }
  if(!isInt(rd) || rd<1 || rd>20){ return null; }
  var n=clean(r.n,60), c=clean(r.c,60);
  if(!n){ return null; }
  var out={y:y,r:rd,n:n,c:c,m:r.m==='50'?'50':'100',t:isInt(r.t)&&r.t>0?r.t:0,o:'a'};
  if(typeof r.s==='string'){
    var p=strToShots(r.s);
    if(!p || p.shots.every(function(v){ return v===null; })){ return null; }
    out.s=r.s;
  } else {
    var g=Number(r.g), z=Number(r.z), i=Number(r.i);
    if(!isInt(g) || !isInt(z) || !isInt(i)){ return null; }
    if(g<0 || g>100 || z<0 || z>10 || i<0 || i>z || g<z*10){ return null; }
    out.o='m'; out.g=g; out.z=z; out.i=i;
  }
  return out;
}
function resultOf(rec){
  if(rec.s){
    var p=strToShots(rec.s), ev=evaluate(p.shots,p.inner);
    return {ring:ev.counted,z:ev.tens,i:ev.inner,n:ev.n,ev:ev,p:p};
  }
  return {ring:rec.g,z:rec.z,i:rec.i,n:COUNT,ev:null,p:null};
}
function slotKey(rec){ return rec.y+'|'+rec.r+'|'+pid(rec.n,rec.c); }
function sameResult(a,b){
  if(a.s || b.s){ return a.s===b.s; }
  return a.g===b.g && a.z===b.z && a.i===b.i;
}

/* ---------- Ranglisten ---------- */
function placeRows(rows,eq){
  rows.forEach(function(row,idx){
    row.place=(idx>0 && eq(rows[idx-1],row)) ? rows[idx-1].place : idx+1;
  });
  return rows;
}
// Saison: Durchschnitt der besten 6 Ergebnisse, dann Zehner (inkl. Innenzehner), dann Innenzehner
function seasonTable(records,year){
  var map={}, roundSet={};
  records.forEach(function(rec){
    if(rec.y!==year){ return; }
    roundSet[rec.r]=true;
    var k=pid(rec.n,rec.c);
    var e=map[k]||(map[k]={key:k,name:rec.n,club:rec.c,byRound:{}});
    var res=resultOf(rec); res.r=rec.r; res.rec=rec;
    e.byRound[rec.r]=res;
  });
  var rows=Object.keys(map).map(function(k){
    var e=map[k];
    var list=Object.keys(e.byRound).map(function(r){ return e.byRound[r]; });
    var sorted=list.slice().sort(function(a,b){ return b.ring-a.ring || b.z-a.z || b.i-a.i || a.r-b.r; });
    var kept=sorted.slice(0,BEST), keptR={};
    var sum=0,z=0,i=0;
    kept.forEach(function(x){ keptR[x.r]=true; sum+=x.ring; z+=x.z; i+=x.i; });
    return {key:k,name:e.name,club:e.club,byRound:e.byRound,kept:keptR,used:kept.length,starts:list.length,sum:sum,avg:sum/kept.length,z:z,i:i};
  });
  rows.sort(function(a,b){
    var d=b.sum*a.used-a.sum*b.used;           // exakter Durchschnittsvergleich ohne Kommazahlen
    if(d!==0){ return d>0?1:-1; }
    return (b.z-a.z) || (b.i-a.i) || a.name.localeCompare(b.name,'de');
  });
  placeRows(rows,function(a,b){ return a.sum*b.used===b.sum*a.used && a.z===b.z && a.i===b.i; });
  var rounds=Object.keys(roundSet).map(Number).sort(function(a,b){ return a-b; });
  return {rows:rows,rounds:rounds};
}
// Tagesliste: Ringe, dann Zehner, dann Innenzehner
function dayTable(records,year,round){
  var rows=[];
  records.forEach(function(rec){
    if(rec.y!==year || rec.r!==round){ return; }
    var res=resultOf(rec);
    rows.push({name:rec.n,club:rec.c,rec:rec,ring:res.ring,z:res.z,i:res.i,n:res.n,p:res.p,ev:res.ev});
  });
  rows.sort(function(a,b){ return (b.ring-a.ring) || (b.z-a.z) || (b.i-a.i) || a.name.localeCompare(b.name,'de'); });
  placeRows(rows,function(a,b){ return a.ring===b.ring && a.z===b.z && a.i===b.i; });
  return rows;
}

/* ---------- Zusammenführen ---------- */
function planMerge(existing,incoming){
  var idx={};
  existing.forEach(function(r){ idx[slotKey(r)]=r; });
  var seen={}, add=[], dup=[], conflicts=[];
  incoming.forEach(function(r){
    var k=slotKey(r);
    if(seen[k]){
      if(!sameResult(seen[k],r)){ conflicts.push({old:seen[k],neu:r}); }
      else { dup.push(r); }
      return;
    }
    seen[k]=r;
    var old=idx[k];
    if(!old){ add.push(r); }
    else if(sameResult(old,r)){ dup.push(r); }
    else { conflicts.push({old:old,neu:r}); }
  });
  return {add:add,dup:dup,conflicts:conflicts};
}

/* ---------- Link-Code: JSON -> deflate-raw -> base64url ---------- */
function b64uFromBytes(bytes){
  var s='';
  for(var i=0;i<bytes.length;i+=0x8000){ s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); }
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function bytesFromB64u(str){
  var b=str.replace(/-/g,'+').replace(/_/g,'/');
  while(b.length%4){ b+='='; }
  var s=atob(b), out=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++){ out[i]=s.charCodeAt(i); }
  return out;
}
function pipe(bytes,Ctor,fmt){
  var s=new Ctor(fmt), w=s.writable.getWriter();
  // Fehler kommen beim Lesen an; die Schreib-Versprechen duerfen keine unbehandelte Meldung ausloesen
  w.write(bytes).catch(function(){}); w.close().catch(function(){});
  return new Response(s.readable).arrayBuffer().then(function(b){ return new Uint8Array(b); });
}
function encode(records){
  var json=JSON.stringify({k:'igor-ergebnisse',v:1,a:records});
  var raw=new TextEncoder().encode(json);
  if(typeof CompressionStream!=='undefined'){
    return pipe(raw,CompressionStream,'deflate-raw').then(function(z){ return 'z.'+b64uFromBytes(z); },function(){ return 'u.'+b64uFromBytes(raw); });
  }
  return Promise.resolve('u.'+b64uFromBytes(raw));
}
function decode(code){
  var m=/^([zu])\.([A-Za-z0-9_-]+)$/.exec(String(code||'').trim());
  if(!m){ return Promise.reject(new Error('Das ist kein gültiger IGOR-Code.')); }
  var bytes;
  try{ bytes=bytesFromB64u(m[2]); }catch(e){ return Promise.reject(new Error('Der Code ist beschädigt.')); }
  var p;
  if(m[1]==='z'){
    if(typeof DecompressionStream==='undefined'){ return Promise.reject(new Error('Dieser Browser ist zu alt, um den Code zu entpacken.')); }
    p=pipe(bytes,DecompressionStream,'deflate-raw');
  } else { p=Promise.resolve(bytes); }
  return p.then(function(raw){
    var o=JSON.parse(new TextDecoder().decode(raw));
    if(!o || o.k!=='igor-ergebnisse' || !Array.isArray(o.a)){ throw new Error('Das ist kein IGOR-Ergebnis-Code.'); }
    if(o.a.length>MAXRECORDS){ throw new Error('Der Code enthält zu viele Ergebnisse.'); }
    var recs=[], bad=0;
    o.a.forEach(function(r){ var c=sanitizeRecord(r); if(c){ recs.push(c); } else { bad++; } });
    return {records:recs,rejected:bad};
  },function(e){
    if(e && e.message && /^(Das|Der|Dieser)/.test(e.message)){ throw e; }
    throw new Error('Der Code ist beschädigt oder unvollständig.');
  });
}
// findet Codes in eingefügtem Text (Link, mehrere Links aus WhatsApp, reiner Code)
function extractCodes(text){
  var out=[], re=/(?:^|[\s#?&=])([zu]\.[A-Za-z0-9_-]{12,})/g, m;
  while((m=re.exec(String(text||'')))){ out.push(m[1]); }
  return out;
}
function chunk(list,size){
  var out=[];
  for(var i=0;i<list.length;i+=size){ out.push(list.slice(i,i+size)); }
  return out;
}

return {
  SHOTS:SHOTS,COUNT:COUNT,BEST:BEST,
  evaluate:evaluate,clean:clean,nkey:nkey,pid:pid,esc:esc,fmt2:fmt2,
  shotsToStr:shotsToStr,strToShots:strToShots,sanitizeRecord:sanitizeRecord,resultOf:resultOf,
  slotKey:slotKey,sameResult:sameResult,seasonTable:seasonTable,dayTable:dayTable,planMerge:planMerge,
  encode:encode,decode:decode,extractCodes:extractCodes,chunk:chunk
};
})();
if(typeof module!=='undefined' && module.exports){ module.exports=IGORCORE; }

</script>
<script>
(function(){
'use strict';
var C=IGORCORE;
var LS='igor-tabelle-v1', NOW=new Date().getFullYear();
var store={results:[],backupAt:0,changedAt:0};
var ui={tab:'season',year:NOW,day:0,q:'',club:''};
var dlg=null, toastT=null;
function $(id){ return document.getElementById(id); }
var esc=C.esc;

/* ---------- Speicher ---------- */
function load(){
  try{
    var o=JSON.parse(localStorage.getItem(LS)||'null');
    if(o && Array.isArray(o.results)){
      store.results=o.results.map(function(r){ return C.sanitizeRecord(r); }).filter(Boolean);
      store.backupAt=Number.isInteger(o.backupAt)?o.backupAt:0;
      store.changedAt=Number.isInteger(o.changedAt)?o.changedAt:0;
    }
  }catch(e){}
}
function save(){
  store.changedAt=Math.floor(Date.now()/1000);
  try{ localStorage.setItem(LS,JSON.stringify(store)); }
  catch(e){ toast('Speichern im Browser nicht möglich. Bitte eine Sicherung herunterladen.'); }
  try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } }catch(e){}
}
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; },4500);
}
function years(){
  var set={}; set[NOW]=1;
  store.results.forEach(function(r){ set[r.y]=1; });
  return Object.keys(set).map(Number).sort(function(a,b){ return b-a; });
}
function roundsOf(year){
  var s={}; store.results.forEach(function(r){ if(r.y===year){ s[r.r]=1; } });
  return Object.keys(s).map(Number).sort(function(a,b){ return a-b; });
}
function dateStr(ts){ return ts?new Date(ts*1000).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'noch nie'; }
function f1(x){ return C.fmt2(x); }

/* ---------- Rahmen: Kopf und Reiter ---------- */
function renderFrame(){
  var ys=years();
  if(ys.indexOf(ui.year)<0){ ui.year=ys[0]; }
  $('yearsel').innerHTML=ys.map(function(y){ return '<option value="'+y+'"'+(y===ui.year?' selected':'')+'>'+y+'</option>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===ui.tab));
  });
}
function render(){
  renderFrame();
  if(ui.tab==='season'){ renderSeason(); }
  else if(ui.tab==='day'){ renderDay(); }
  else if(ui.tab==='add'){ renderAdd(); }
  else { renderData(); }
}
function emptyHtml(){

function addGo(){
  readAdd();

  if(!C.clean(addDraft.n,60)){ return bad('Bitte den Namen eintragen.'); }

  var yy=parseInt($('a-y').value,10);
  var rec=C.sanitizeRecord({y:yy,r:addDraft.r,n:addDraft.n,c:addDraft.c,m:'100',t:Math.floor(Date.now()/1000),o:'m',g:g,z:z,i:i});
  if(!rec){ return bad('Die Werte passen nicht zusammen: Ringe 0–100, Zehner 0–10, Innenzehner höchstens so viele wie Zehner, und die Ringe müssen mindestens Zehner × 10 betragen.'); }
  var p=C.planMerge(store.results,[rec]);
  ui.year=yy;
  if(p.dup.length){ return bad('Dieses Ergebnis ist schon vorhanden.'); }
  if(p.conflicts.length){ openPlan({title:'Schon ein Ergebnis vorhanden',add:[],dup:0,conflicts:p.conflicts,rejected:0,after:function(){ addDraft.n='';addDraft.g='';addDraft.z='';addDraft.i=''; renderAdd(); }}); return; }

function lev(a,b){
  var m=a.length,n=b.length; if(!m){ return n; } if(!n){ return m; }
  var prev=[],cur=[],i,j;
  for(j=0;j<=n;j++){ prev[j]=j; }
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); }
    prev=cur.slice();
  }
  return prev[n];
}
function personsOf(list){
  var m={}; list.forEach(function(r){ var k=C.pid(r.n,r.c); (m[k]||(m[k]={key:k,n:r.n,c:r.c,y:{},cnt:0})).cnt++; m[k].y[r.y]=1; });
  return Object.keys(m).map(function(k){ return m[k]; });
}
function similarPairs(){
  var ps=personsOf(store.results).filter(function(p){ return p.y[ui.year]; }), out=[];
  for(var a=0;a<ps.length;a++){ for(var b=a+1;b<ps.length;b++){
    var A=ps[a],B=ps[b];
    if(C.nkey(A.c)!==C.nkey(B.c)){ continue; }
    var na=C.nkey(A.n), nb=C.nkey(B.n);
    if(Math.max(na.length,nb.length)<6){ continue; }
    var d=lev(na,nb);
    if(d>=1 && d<=2){ out.push([A,B]); }
  } }
  return out.slice(0,20);
}
function dupHtml(){
  var pairs=similarPairs();
  if(!pairs.length){ return ''; }
  var h='<div class="card stack"><h2>Mögliche Doppelte ('+pairs.length+')</h2><p class="msg">Ähnliche Namen im selben Verein, vielleicht Tippfehler. Prüfe und führe sie bei Bedarf zusammen.</p>';
  pairs.forEach(function(pr,i){
    h+='<div class="lrow"><div class="nm2">'+esc(pr[0].n)+'</div><div class="sub">'+pr[0].cnt+' Ergebnis'+(pr[0].cnt===1?'':'se')+' · '+esc(pr[0].c||'ohne Verein')+'</div>'
     +'<div class="nm2" style="grid-column:1;margin-top:4px">'+esc(pr[1].n)+'</div><div class="sub">'+pr[1].cnt+' Ergebnis'+(pr[1].cnt===1?'':'se')+'</div>'
     +'<div class="acts"><button type="button" class="btn small" data-act="merge" data-from="'+esc(pr[1].key)+'" data-to="'+esc(pr[0].key)+'">„'+esc(pr[1].n)+'“ → „'+esc(pr[0].n)+'“</button><button type="button" class="btn small" data-act="merge" data-from="'+esc(pr[0].key)+'" data-to="'+esc(pr[1].key)+'">umgekehrt</button></div></div>';
  });
  return h+'</div>';
}

/* ---------- Plan-Dialog: Import, Zusammenführen, Konflikte ---------- */
function openPlan(opt){
  var base=opt.base||store.results;
  var items=opt.add.map(function(rec){
    var it={rec:rec,sim:null,merge:false};
    // Aehnlicher Name im selben Verein, der in diesem Wettkampf noch kein Ergebnis hat?
    var kn=C.nkey(rec.n), kc=C.nkey(rec.c);
    var hasKey=false; personsOf(base).forEach(function(p){ if(p.key===C.pid(rec.n,rec.c)){ hasKey=true; } });
    if(!hasKey && kn.length>=6){
      personsOf(base).forEach(function(p){
        if(it.sim || C.nkey(p.c)!==kc){ return; }
        var d=lev(kn,C.nkey(p.n));
        if(d>=1 && d<=2){
          var renamed=Object.assign({},rec,{n:p.n,c:p.c});
          var clash=base.some(function(b){ return C.slotKey(b)===C.slotKey(renamed); });
          if(!clash){ it.sim=p; }
        }
      });
    }
    return it;
  });
  dlg={kind:'plan',opt:opt,base:base,items:items,choice:opt.conflicts.map(function(c){ return (c.neu.t>=c.old.t)?'neu':'old'; })};
  openDlg();
}
function recLine(rec){ var r=C.resultOf(rec); return r.ring+' Ringe · Z '+r.z+' · IZ '+r.i+(rec.o==='a'?'':' (von Hand)'); }
function planHtml(){
  var o=dlg.opt, h='';
  h+='<p class="msg"><b>'+dlg.items.length+'</b> neu'+(o.dup?' · <b>'+o.dup+'</b> schon vorhanden':'')+(o.conflicts.length?' · <b>'+o.conflicts.length+'</b> Konflikt'+(o.conflicts.length===1?'':'e'):'')+'</p>';
  if(o.notes){ o.notes.forEach(function(n){ h+='<p class="msg warn">'+esc(n)+'</p>'; }); }
  if(o.rejected){ h+='<p class="msg warn">'+o.rejected+' ungültige Datensätze wurden ignoriert.</p>'; }
  dlg.items.forEach(function(it,i){
    var r=it.rec;
    h+='<div class="lrow"><div class="nm2">'+esc(r.n)+'</div><div class="sub">'+esc(r.c||'ohne Verein')+' · Wettkampf '+r.r+' / '+r.y+'</div><div class="rs num"><b>'+C.resultOf(r).ring+'</b><span>Z '+C.resultOf(r).z+' · IZ '+C.resultOf(r).i+'</span></div>';
    if(it.sim){ h+='<div class="acts"><label class="opt'+(it.merge?' sel':'')+'" style="flex:1"><input type="checkbox" data-sim="'+i+'"'+(it.merge?' checked':'')+'><span>Ist dieselbe Person wie <b>'+esc(it.sim.n)+'</b> (ähnlicher Name)? Dann unter dieser Schreibweise speichern.</span></label></div>'; }
    h+='</div>';
  });
  o.conflicts.forEach(function(c,i){
    h+='<div class="card stack" style="padding:10px"><div class="msg"><b>Konflikt:</b> '+esc(c.neu.n)+' · '+esc(c.neu.c||'ohne Verein')+' · Wettkampf '+c.neu.r+'</div>'
     +'<label class="opt'+(dlg.choice[i]==='old'?' sel':'')+'"><input type="radio" name="c'+i+'" value="old"'+(dlg.choice[i]==='old'?' checked':'')+'><span><b>Vorhanden behalten</b><br>'+recLine(c.old)+'</span></label>'
     +'<label class="opt'+(dlg.choice[i]==='neu'?' sel':'')+'"><input type="radio" name="c'+i+'" value="neu"'+(dlg.choice[i]==='neu'?' checked':'')+'><span><b>Neues übernehmen</b><br>'+recLine(c.neu)+'</span></label></div>';
  });
  var count=dlg.items.length+dlg.choice.filter(function(x){ return x==='neu'; }).length;
  h+='<div class="btn-row"><button type="button" class="btn" data-act="dlg-cancel">Abbrechen</button><button type="button" class="btn primary" data-act="plan-ok">Übernehmen'+(count?' ('+count+')':'')+'</button></div>';
  return h;
}
function planApply(){
  var o=dlg.opt, base=dlg.base, res=base.slice(), adds=0;
  dlg.items.forEach(function(it){
    var rec=it.rec; if(it.merge && it.sim){ rec=Object.assign({},rec,{n:it.sim.n,c:it.sim.c}); }
    res.push(rec); adds++;
  });
  o.conflicts.forEach(function(c,i){
    if(dlg.choice[i]==='neu'){
      var k=C.slotKey(c.old);
      res=res.filter(function(r){ return C.slotKey(r)!==k; });
      res.push(c.neu); adds++;
    }
  });
  store.results=res; save();
  var years0=dlg.items.map(function(it){ return it.rec.y; }).concat(o.conflicts.map(function(c){ return c.neu.y; }));
  var firstRec=(dlg.items[0]&&dlg.items[0].rec)||(o.conflicts[0]&&o.conflicts[0].neu);
  closeDlg();
  if(firstRec && o.jump){ ui.year=firstRec.y; ui.day=firstRec.r; ui.tab='season'; }
  toast(adds+' Ergebnis'+(adds===1?'':'se')+' übernommen');
  if(o.after){ o.after(); } else { render(); }
}

/* ---------- Import ---------- */
function importCodes(codes){
  Promise.all(codes.map(function(c,i){
    return C.decode(c).then(function(r){ return {ok:r}; },function(e){ return {err:(codes.length>1?'Link '+(i+1)+': ':'')+e.message}; });
  })).then(function(list){
    var recs=[], rejected=0, notes=[];
    list.forEach(function(x){ if(x.ok){ recs=recs.concat(x.ok.records); rejected+=x.ok.rejected; } else { notes.push(x.err); } });
    if(!recs.length){ openMsg('Nichts übernommen',notes.length?notes:['Es wurden keine Ergebnisse gefunden.']); return; }
    var p=C.planMerge(store.results,recs);
    if(!p.add.length && !p.conflicts.length){ openMsg('Schon alles vorhanden',['Diese '+p.dup.length+' Ergebnisse sind bereits in der Tabelle.']); return; }
    openPlan({title:'Ergebnisse übernehmen',add:p.add,dup:p.dup.length,conflicts:p.conflicts,rejected:rejected,notes:notes,jump:true});
  });
}
function handleHash(){
  var m=/[#&]d=([zu]\.[A-Za-z0-9_-]+)/.exec(location.hash||'');
  if(!m){ return; }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  importCodes([m[1]]);
}

  recs.forEach(function(r){
    var res=C.resultOf(r);
    h+='<div class="lrow"><div class="nm2">Wettkampf '+r.r+'</div><div class="sub">'+(r.o==='a'?'App · '+r.m+' m'+(res.n<C.SHOTS?' · '+res.n+' Schuss':''):'von Hand erfasst')+'</div>'
     +'<div class="rs num"><b>'+res.ring+'</b><span>Z '+res.z+' · IZ '+res.i+'</span></div>'
     +'<div class="acts">'+(res.p?'<span class="muted" style="font-size:13px">'+res.p.shots.map(function(v,i){ return v===null?'':(res.ev.struck.has(i)?'<s>'+v+'</s>':'<span'+(res.p.inner[i]?' style="color:var(--accent);font-weight:700"':'')+'>'+v+'</span>'); }).filter(Boolean).join(' ')+'</span>':'')
     +'<span style="flex:1"></span><button type="button" class="btn small danger" data-act="del-res" data-r="'+r.r+'">'+(dlg.pendingDel===r.r?'Wirklich löschen?':'Löschen')+'</button></div></div>';
  });
  h+='</div><div class="card stack" style="padding:10px"><h2 style="font-size:16px">Name oder Verein ändern</h2><p class="msg">Gilt für alle Ergebnisse dieser Saison. Stimmt der neue Name mit einem vorhandenen Schützen überein, werden beide zusammengeführt.</p>'
   +'<label class="f">Name<input type="text" id="p-n" list="dl-n" autocomplete="off" maxlength="60" value="'+esc(recs[0].n)+'"></label>'
   +'<label class="f">Verein<input type="text" id="p-c" list="dl-c" autocomplete="off" maxlength="60" value="'+esc(recs[0].c)+'"></label>'
   +'<datalist id="dl-n">'+knownNames().map(function(v){ return '<option value="'+esc(v)+'"></option>'; }).join('')+'</datalist><datalist id="dl-c">'+knownClubs().map(function(v){ return '<option value="'+esc(v)+'"></option>'; }).join('')+'</datalist>'
   +'<div class="btn-row"><button type="button" class="btn primary" data-act="rename">Ändern</button></div></div>';
  return h;
}
function renameKey(fromKey,toName,toClub,fromYearOnly){
  var nn=C.clean(toName,60), nc=C.clean(toClub,60);
  if(!nn){ toast('Bitte einen Namen eintragen.'); return; }
  var inc=store.results.filter(function(r){ return r.y===ui.year && C.pid(r.n,r.c)===fromKey; });
  var rest=store.results.filter(function(r){ return !(r.y===ui.year && C.pid(r.n,r.c)===fromKey); });
  var incoming=inc.map(function(r){ return Object.assign({},r,{n:nn,c:nc}); });
  var p=C.planMerge(rest,incoming);
  var dups=p.dup;
  if(!p.conflicts.length){
    store.results=rest.concat(p.add);
    // identische Doppelte (gleiches Ergebnis) fallen weg
    save(); closeDlg(); toast('Geändert'+(dups.length?' · '+dups.length+' doppelte Einträge entfernt':'')); render(); return;
  }
  openPlan({title:'Schützen zusammenführen',base:rest,add:p.add,dup:dups.length,conflicts:p.conflicts,rejected:0});
}

/* ---------- Dialog-Gerüst ---------- */
function openMsg(title,lines){ dlg={kind:'msg',title:title,lines:lines}; openDlg(); }
function openConfirm(title,text,act){ dlg={kind:'confirm',title:title,text:text,act:act}; openDlg(); }
function openDlg(){ $('dlg').hidden=false; renderDlg(); }
function closeDlg(){ $('dlg').hidden=true; dlg=null; }
function renderDlg(){
  if(!dlg){ return; }
  var t=$('dlg-title'), b=$('dlg-body'), st=b.scrollTop;
  setTimeout(function(){ b.scrollTop=st; },0);
  if(dlg.kind==='plan'){ t.textContent=dlg.opt.title; b.innerHTML=planHtml(); }
  else if(dlg.kind==='person'){
    var r0=dlg.recs[0]; t.textContent=r0.n+(r0.c?' · '+r0.c:'');
    b.innerHTML=personHtml();
  }
  else if(dlg.kind==='msg'){
    t.textContent=dlg.title;
    b.innerHTML=dlg.lines.map(function(l){ return '<p class="msg">'+esc(l)+'</p>'; }).join('')+'<div class="btn-row"><button type="button" class="btn primary" data-act="dlg-cancel">OK</button></div>';
  }
  else if(dlg.kind==='confirm'){
    t.textContent=dlg.title;
    b.innerHTML='<p class="msg">'+esc(dlg.text)+'</p><div class="btn-row"><button type="button" class="btn" data-act="dlg-cancel">Abbrechen</button><button type="button" class="btn danger" data-act="confirm-ok">Ja, löschen</button></div>';
  }
}

/* ---------- Export ---------- */
function download(name,text,mime){
  var blob=new Blob([text],{type:mime}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); },1000);
}
function csvCell(v){ v=String(v==null?'':v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportSeasonCsv(){
  var t=C.seasonTable(store.results,ui.year), cols=t.rounds, head=['Platz','Name','Verein'];
  cols.forEach(function(n){ head.push(n+'.'); });
  head=head.concat(['Summe','Durchschnitt','Zehner','Innenzehner']);
  var lines=[head.join(';')];
  t.rows.forEach(function(r){
    var row=[r.place,csvCell(r.name),csvCell(r.club)];
    cols.forEach(function(k){ var c=r.byRound[k]; row.push(c?c.ring:''); });
    row=row.concat([r.sum,C.fmt2(r.avg),r.z,r.i]); lines.push(row.join(';'));
  });
  download('igor-einzelwertung-'+ui.year+'.csv','﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function exportDayCsv(){
  var rows=C.dayTable(store.results,ui.year,ui.day), lines=['Platz;Name;Verein;Ringe;Zehner;Innenzehner'];
  rows.forEach(function(r){ lines.push([r.place,csvCell(r.name),csvCell(r.club),r.ring,r.z,r.i].join(';')); });
  download('igor-wettkampf-'+ui.day+'-'+ui.year+'.csv','﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function backup(){
  var stamp=new Date().toISOString().slice(0,10);
  download('igor-saison-'+stamp+'.json',JSON.stringify({k:'igor-saison',v:1,exported:Math.floor(Date.now()/1000),results:store.results}),'application/json');
  store.backupAt=Math.floor(Date.now()/1000); save();
  toast('Sicherung gespeichert'); if(ui.tab==='data'){ renderData(); }
}
function restoreFile(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(String(rd.result));
      if(!o || o.k!=='igor-saison' || !Array.isArray(o.results)){ throw new Error('x'); }
      var recs=[], bad=0;
      o.results.slice(0,5000).forEach(function(r){ var c=C.sanitizeRecord(r); if(c){ recs.push(c); } else { bad++; } });
      var p=C.planMerge(store.results,recs);
      if(!p.add.length && !p.conflicts.length){ openMsg('Schon alles vorhanden',['Die Sicherung enthält nichts Neues.']); return; }
      openPlan({title:'Sicherung einspielen',add:p.add,dup:p.dup.length,conflicts:p.conflicts,rejected:bad,jump:true});
    }catch(e){ openMsg('Sicherung nicht lesbar',['Die Datei ist keine IGOR-Sicherung oder beschädigt.']); }
  };
  rd.readAsText(file);
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',function(ev){
  var tb=ev.target.closest('.tabs button');
  if(tb){ ui.tab=tb.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
  if(ev.target.id==='dlg'){ if(dlg && dlg.kind!=='plan'){ closeDlg(); } return; }
  if(ev.target.id==='dlg-x'){ closeDlg(); return; }
  var b=ev.target.closest('[data-act]'); if(!b){ return; }
  var act=b.getAttribute('data-act');
  switch(act){
    case 'goto': ui.tab=b.getAttribute('data-tab'); render(); break;
    case 'print': window.print(); break;
    case 'csv': exportSeasonCsv(); break;
    case 'csv-day': exportDayCsv(); break;
    case 'day': ui.day=parseInt(b.getAttribute('data-n'),10); renderDay(); break;
    case 'person': openPerson(b.getAttribute('data-key')); break;
    case 'add-go': addGo(); break;
    case 'paste-go':
      var codes=C.extractCodes($('paste').value);
      if(!codes.length){ openMsg('Kein Code gefunden',['Füge den Link oder Code aus der App ein. Er beginnt mit „z.“ oder „u.“ nach dem Zeichen „#d=“.']); }
      else { importCodes(codes); }
      break;
    case 'backup': backup(); break;
    case 'del-year': openConfirm('Saison '+ui.year+' löschen?','Alle Ergebnisse der Saison '+ui.year+' werden aus diesem Browser gelöscht. Das lässt sich nicht rückgängig machen. Speichere vorher eine Sicherung.','del-year'); break;
    case 'del-all': openConfirm('Alles löschen?','Alle gespeicherten Ergebnisse aller Saisons werden aus diesem Browser gelöscht. Das lässt sich nicht rückgängig machen. Speichere vorher eine Sicherung.','del-all'); break;
    case 'confirm-ok':
      if(dlg && dlg.act==='del-year'){ store.results=store.results.filter(function(r){ return r.y!==ui.year; }); }
      else if(dlg && dlg.act==='del-all'){ store.results=[]; }
      save(); closeDlg(); toast('Gelöscht'); render(); break;
    case 'dlg-cancel': closeDlg(); break;
    case 'plan-ok': planApply(); break;
    case 'del-res':
      var rn=parseInt(b.getAttribute('data-r'),10);
      if(dlg.pendingDel===rn){
        store.results=store.results.filter(function(r){ return !(r.y===ui.year && C.pid(r.n,r.c)===dlg.key && r.r===rn); });
        save();
        var left=store.results.filter(function(r){ return r.y===ui.year && C.pid(r.n,r.c)===dlg.key; });
        if(!left.length){ closeDlg(); } else { dlg.recs=left.sort(function(a,c){ return a.r-c.r; }); dlg.pendingDel=null; renderDlg(); }
        toast('Ergebnis gelöscht'); render();
      } else { dlg.pendingDel=rn; renderDlg(); }
      break;
    case 'rename': renameKey(dlg.key,$('p-n').value,$('p-c').value); break;
    case 'merge':
      var fromKey=b.getAttribute('data-from'), toKey=b.getAttribute('data-to');
      var tp=personsOf(store.results).filter(function(p){ return p.key===toKey; })[0];
      if(tp){ renameKey(fromKey,tp.n,tp.c); }
      break;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='yearsel'){ ui.year=parseInt(t.value,10); ui.day=0; render(); }
  else if(t.id==='clubsel'){ ui.club=t.value; fillSeason(); }
  else if(t.id==='restore' && t.files && t.files[0]){ restoreFile(t.files[0]); t.value=''; }
  else if(t.getAttribute && t.getAttribute('data-sim')!==null && dlg){ dlg.items[parseInt(t.getAttribute('data-sim'),10)].merge=t.checked; renderDlg(); }
  else if(t.type==='radio' && dlg && dlg.kind==='plan'){ dlg.choice[parseInt(t.name.slice(1),10)]=t.value; renderDlg(); }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){ ui.q=ev.target.value; fillSeason(); }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape' && dlg){ closeDlg(); }
});

load();
ui.year=store.results.length?Math.max.apply(null,store.results.map(function(r){ return r.y; })):NOW;
render();
handleHash();
window.addEventListener('hashchange',handleHash);

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
